[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
# 300, not 500: CollectPacks (with tier baskets) needs it to stay well under the 24,576-byte limit.
optimizer_runs = 300
via_ir = true
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "./script" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"

[etherscan]
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56 }
